<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1f7a5a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="ClearScanR">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="description" content="ClearScanR PDF Maker.com scans documents, cleans the image, and turns it into a PDF.">
    <title>ClearScanR PDF Maker.com</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/icon.svg">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="workspace" aria-label="Scanner workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow">ClearScanR PDF Maker.com</p>
            <h1>Scan documents into clear PDFs.</h1>
          </div>
          <div class="top-actions">
            <label class="button secondary">
              Import
              <input id="fileInput" type="file" accept="image/*" hidden>
            </label>
            <button id="cameraButton" class="button secondary" type="button">Camera</button>
            <button id="captureButton" class="button accent hidden" type="button">Capture</button>
            <button id="installButton" class="button secondary hidden" type="button">Install</button>
            <button id="pdfButton" class="button primary" type="button" disabled>PDF</button>
          </div>
        </header>

        <div class="scan-stage">
          <div id="emptyState" class="empty-state">
            <div class="scanner-mark" aria-hidden="true">
              <span></span><span></span><span></span><span></span>
            </div>
            <p>Choose an image or use the camera.</p>
          </div>
          <video id="cameraPreview" class="camera-preview hidden" autoplay playsinline muted></video>
          <canvas id="resultCanvas" class="result-canvas hidden"></canvas>
        </div>
      </section>

      <aside class="controls" aria-label="Scan settings">
        <div class="status-line">
          <span id="statusDot" class="status-dot idle"></span>
          <span id="statusText">Ready</span>
        </div>

        <div class="control-group">
          <label for="modeSelect">Finish</label>
          <select id="modeSelect">
            <option value="paper">Clean paper</option>
            <option value="mono">Black and white</option>
            <option value="color">Color scan</option>
          </select>
        </div>

        <div class="segmented" role="group" aria-label="Page crop">
          <button id="cropOn" class="selected" type="button">Auto crop</button>
          <button id="cropOff" type="button">Full image</button>
        </div>

        <div class="control-group">
          <div class="label-row">
            <label for="brightnessRange">Brightness</label>
            <output id="brightnessValue">8</output>
          </div>
          <input id="brightnessRange" type="range" min="-30" max="45" value="8">
        </div>

        <div class="control-group">
          <div class="label-row">
            <label for="contrastRange">Contrast</label>
            <output id="contrastValue">32</output>
          </div>
          <input id="contrastRange" type="range" min="0" max="80" value="32">
        </div>

        <div class="control-group">
          <div class="label-row">
            <label for="sharpnessRange">Sharpness</label>
            <output id="sharpnessValue">28</output>
          </div>
          <input id="sharpnessRange" type="range" min="0" max="80" value="28">
        </div>

        <div class="control-group">
          <div class="label-row">
            <label for="thresholdRange">Ink</label>
            <output id="thresholdValue">52</output>
          </div>
          <input id="thresholdRange" type="range" min="20" max="85" value="52">
        </div>

        <div class="actions-stack">
          <button id="resetButton" class="button secondary full" type="button" disabled>Reset scan</button>
          <button id="imageButton" class="button secondary full" type="button" disabled>Save image</button>
        </div>
      </aside>
    </main>

    <script src="app.js"></script>
  </body>
</html>
